name: Build DEB
on:
  push:
    branches: [main]
    paths:
      - '**.xm'
      - '**.h'
      - '**.json'
      - 'tests/**'
      - 'scripts/**'
      - 'packaging/**'
      - Makefile
      - control
      - SelectBlocks.plist
      - .github/workflows/build.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Test portable game logic
        run: |
          cc -std=c11 -O2 -Wall -Wextra tests/test_game.c -o "$RUNNER_TEMP/selectblocks-test"
          "$RUNNER_TEMP/selectblocks-test"
      - name: Test sound synthesis
        run: |
          cc -std=c11 -O2 -Wall -Wextra tests/test_sound.c -lm -o "$RUNNER_TEMP/selectblocks-sound-test"
          "$RUNNER_TEMP/selectblocks-sound-test"
      - name: Test multilingual triggers
        run: |
          node tests/test_selection.js
          clang -fobjc-arc -framework Foundation tests/test_triggers.m -o "$RUNNER_TEMP/selectblocks-triggers"
          "$RUNNER_TEMP/selectblocks-triggers"
      - name: Check variant metadata
        run: python3 tests/test_variants.py
  build:
    needs: test
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        variant: [rootless, rootful, rootful-legacy]
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          brew list --versions make >/dev/null || brew install make
          brew list --versions ldid >/dev/null || brew install ldid
          brew list --versions xz >/dev/null || brew install xz
          brew list --versions dpkg >/dev/null || brew install dpkg
      - name: Install Theos and SDKs
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          git clone --depth 1 https://github.com/theos/sdks.git "$RUNNER_TEMP/theos-sdks"
          mkdir -p "$HOME/theos/sdks"
          cp -R "$RUNNER_TEMP/theos-sdks/"*.sdk "$HOME/theos/sdks/"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
      - name: Build package variant
        env:
          VARIANT: ${{ matrix.variant }}
        run: bash scripts/build.sh "$VARIANT"
      - name: Validate and name package
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          VERSION="$(awk '/^Version:/{print $2; exit}' control)"
          mkdir -p dist
          for DEB in packages/*.deb; do
            python3 tests/validate_package.py "$VARIANT" "$DEB"
            cp "$DEB" "dist/SelectBlocks_${VERSION}_${VARIANT}.deb"
          done
          test -f "dist/SelectBlocks_${VERSION}_${VARIANT}.deb"
      - uses: actions/upload-artifact@v4
        with:
          name: SelectBlocks-${{ matrix.variant }}
          path: dist/*.deb
          if-no-files-found: error
  release:
    needs: [test, build]
    runs-on: macos-15
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: SelectBlocks-*
          path: dist
          merge-multiple: true
      - name: Publish all three packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(awk '/^Version:/{print $2; exit}' control)"
          test "$(find dist -name '*.deb' | wc -l | tr -d ' ')" = 3
          gh release create "v${VERSION}" dist/*.deb \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "SelectBlocks ${VERSION}" \
            --notes-file RELEASE-NOTES-RU.md
