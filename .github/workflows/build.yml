name: Build DEB
on:
  push:
    branches: [main]
    paths:
      - '**.xm'
      - '**.h'
      - '**.json'
      - 'tests/**'
      - Makefile
      - control
      - SelectBlocks.plist
      - .github/workflows/build.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Test portable game logic
        run: |
          cc -std=c11 -O2 -Wall -Wextra tests/test_game.c -o "$RUNNER_TEMP/selectblocks-test"
          "$RUNNER_TEMP/selectblocks-test"
      - name: Test sound synthesis
        run: |
          cc -std=c11 -O2 -Wall -Wextra tests/test_sound.c -lm -o "$RUNNER_TEMP/selectblocks-sound-test"
          "$RUNNER_TEMP/selectblocks-sound-test"
      - name: Test multilingual triggers
        run: |
          node tests/test_selection.js
          clang -fobjc-arc -framework Foundation tests/test_triggers.m -o "$RUNNER_TEMP/selectblocks-triggers"
          "$RUNNER_TEMP/selectblocks-triggers"
      - name: Install build tools
        run: |
          brew list --versions make >/dev/null || brew install make
          brew list --versions ldid >/dev/null || brew install ldid
          brew list --versions xz >/dev/null || brew install xz
          brew list --versions dpkg >/dev/null || brew install dpkg
      - name: Install Theos and SDKs
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          git clone --depth 1 https://github.com/theos/sdks.git "$RUNNER_TEMP/theos-sdks"
          mkdir -p "$HOME/theos/sdks"
          cp -R "$RUNNER_TEMP/theos-sdks/"*.sdk "$HOME/theos/sdks/"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
      - name: Build rootless package
        run: gmake clean package FINALPACKAGE=1
      - name: Downloadable DEB
        uses: actions/upload-artifact@v4
        with:
          name: SelectBlocks-rootless-DEB
          path: packages/*.deb
          if-no-files-found: error
      - name: Publish DEB to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(awk '/^Version:/{print $2; exit}' control)"
          TAG="v${VERSION}"
          gh release create "$TAG" packages/*.deb \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "SelectBlocks ${VERSION}" \
            --notes "SelectBlocks 1.0.0 — обычный релиз без пометки Experimental. Добавлены заново синтезированные короткие 8-битные эффекты движения, поворота, падения, фиксации, линий, четырёх линий, HOLD и проигрыша. SND/OFF вверху отключает звук; настройка сохраняется отдельно для каждого приложения. Фоновая музыка не включена; аудиосессия приложения не перенастраивается. Скачивайте .deb из Assets. Предыдущую версию пользователь проверил на своём iPhone; новые звуковые эффекты и работа во всех приложениях не подтверждены тестированием на устройстве. Называние обычным релизом не гарантирует отсутствие ошибок. Совместимость и удаление описаны в README-RU.txt."
