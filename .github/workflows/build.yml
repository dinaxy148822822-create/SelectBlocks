name: Build DEB
on:
  push:
    branches: [main]
    paths:
      - '**.xm'
      - '**.h'
      - Makefile
      - control
      - SelectBlocks.plist
      - .github/workflows/build.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Test portable game logic
        run: |
          cc -std=c11 -O2 -Wall -Wextra tests/test_game.c -o "$RUNNER_TEMP/selectblocks-test"
          "$RUNNER_TEMP/selectblocks-test"
      - name: Install build tools
        run: |
          brew list --versions make >/dev/null || brew install make
          brew list --versions ldid >/dev/null || brew install ldid
          brew list --versions xz >/dev/null || brew install xz
          brew list --versions dpkg >/dev/null || brew install dpkg
      - name: Install Theos and SDKs
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          git clone --depth 1 https://github.com/theos/sdks.git "$RUNNER_TEMP/theos-sdks"
          mkdir -p "$HOME/theos/sdks"
          cp -R "$RUNNER_TEMP/theos-sdks/"*.sdk "$HOME/theos/sdks/"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
      - name: Build rootless package
        run: gmake clean package FINALPACKAGE=1
      - name: Downloadable DEB
        uses: actions/upload-artifact@v4
        with:
          name: SelectBlocks-rootless-DEB
          path: packages/*.deb
          if-no-files-found: error
      - name: Publish experimental DEB to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(awk '/^Version:/{print $2; exit}' control)"
          TAG="v${VERSION}-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$TAG" packages/*.deb \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "SelectBlocks ${VERSION} — experimental build ${GITHUB_RUN_NUMBER}" \
            --notes "Экспериментальный rootless-твик для iOS 16. Версия 0.2: нативные кнопки снизу, выделенный сброс, анимация появления с поддержкой Reduce Motion, надпись TETRIS и процедурные объёмные текстуры блоков. Скачивайте файл .deb из Assets. Сборка не означает проверку работы на iPhone: нативный интерфейс и совместимость с устройством не протестированы. Поддержка выделения зависит от приложения; возможны сбои. Перед установкой убедитесь, что умеете запускать jailbreak без инъекции твиков для удаления пакета. Исходники и ограничения: README-RU.txt в репозитории."
